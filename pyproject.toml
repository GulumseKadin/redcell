[project]
name = "redcell"
version = "0.0.1"
description = "Authorized autonomous red-team agent framework (skeleton)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
mcp = ["mcp>=1.0"]
neo4j = ["neo4j>=5.0"]
cvss = ["cvss>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
redcell = "redcell.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redcell"]

[tool.ruff]
line-length = 100
target-version = "py311"
